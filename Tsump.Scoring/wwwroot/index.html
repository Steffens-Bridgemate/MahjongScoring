<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tsumo! Scoring</title>
    <meta property="og:title" content="Tsumo! — Scores invoeren" />
    <meta property="og:description" content="Tik op de link om de eindscores voor je mahjongtafel in te voeren." />
    <meta property="og:type" content="website" />
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <!-- Vendored locally (not from a CDN) so the PWA's icons render offline — see the
         service worker's offline precache. The CSS references fonts/bootstrap-icons.woff2|woff
         relative to itself. -->
    <link rel="stylesheet" href="lib/bootstrap-icons/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- Scoped CSS bundle — pulls in Tsump.Shared component styles (ScoreTable narrow/wide). -->
    <link href="Tsump.Scoring.styles.css" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script type="importmap"></script>
    <script>
        // GitHub Pages SPA decoder — restores the original route after 404.html bounced us
        // back to index.html with the path encoded as a query string.
        // Pair: see wwwroot/404.html.
        (function (l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function (s) {
                    return s.replace(/~and~/g, '&');
                }).join('?');
                window.history.replaceState(null, null,
                    l.pathname.slice(0, -1) + decoded + l.hash
                );
            }
        })(window.location);
    </script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="lib/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.copyToClipboard = function (html, plainText) {
            var htmlBlob = new Blob([html], { type: 'text/html' });
            var textBlob = new Blob([plainText], { type: 'text/plain' });
            var item = new ClipboardItem({ 'text/html': htmlBlob, 'text/plain': textBlob });
            return navigator.clipboard.write([item]);
        };
        window.copyTextToClipboard = function (plainText) {
            return navigator.clipboard.writeText(plainText);
        };
        // Shared helper: renders a QR SVG (with optional title band above) to a PNG blob.
        // Used by both the clipboard-copy and save-as-file paths so the rasterisation
        // stays consistent. Canvas size is read from the SVG viewBox directly —
        // img.naturalWidth is unreliable for viewBox-only SVGs across browsers.
        async function renderQrToPngBlob(svgMarkup, qrSize, title, headerBg, headerFg) {
            var vbMatch = svgMarkup.match(/viewBox="0 0 (\d+)/);
            var size = vbMatch ? parseInt(vbMatch[1]) : qrSize;
            var titleHeight = title ? 56 : 0;

            var canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size + titleHeight;
            var ctx = canvas.getContext('2d');
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, size, size + titleHeight);

            if (title) {
                if (headerBg) {
                    ctx.fillStyle = headerBg;
                    ctx.fillRect(0, 0, size, titleHeight);
                    ctx.fillStyle = headerFg || 'white';
                } else {
                    ctx.fillStyle = 'black';
                }
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                var maxWidth = size * 0.9;
                var fontSize = 28;
                ctx.font = 'bold ' + fontSize + 'px sans-serif';
                while (ctx.measureText(title).width > maxWidth && fontSize > 12) {
                    fontSize -= 1;
                    ctx.font = 'bold ' + fontSize + 'px sans-serif';
                }
                ctx.fillText(title, size / 2, titleHeight / 2);
            }

            var svgBlob = new Blob([svgMarkup], { type: 'image/svg+xml;charset=utf-8' });
            var url = URL.createObjectURL(svgBlob);
            try {
                var img = new Image();
                await new Promise(function (resolve, reject) {
                    img.onload = resolve;
                    img.onerror = reject;
                    img.src = url;
                });
                ctx.drawImage(img, 0, titleHeight, size, size);
            } finally {
                URL.revokeObjectURL(url);
            }

            return await new Promise(function (resolve) { canvas.toBlob(resolve, 'image/png'); });
        }

        window.copyQrImageToClipboard = async function (svgMarkup, qrSize, title, headerBg, headerFg) {
            // Writes the rasterised QR PNG to the clipboard. Must be called from a
            // user-gesture handler. headerBg/headerFg colour the title band so the
            // organizer (blue) and scoring app (green) QRs are visually distinguishable
            // in WhatsApp now that on-QR overlays were dropped for scanner compatibility.
            if (!navigator.clipboard || !navigator.clipboard.write || !window.ClipboardItem) return false;
            try {
                var pngBlob = await renderQrToPngBlob(svgMarkup, qrSize, title, headerBg, headerFg);
                if (!pngBlob) return false;
                await navigator.clipboard.write([new ClipboardItem({ 'image/png': pngBlob })]);
                return true;
            } catch (e) {
                console.warn('copyQrImageToClipboard failed:', e);
                return false;
            }
        };

        window.downloadQrAsPng = async function (svgMarkup, qrSize, title, headerBg, headerFg, filename) {
            // Triggers a browser download of the rasterised QR PNG. Same rendering as
            // the clipboard path; differs only in delivery (anchor + .click() instead of
            // clipboard.write). The user's browser handles the actual file-picker UX.
            try {
                var pngBlob = await renderQrToPngBlob(svgMarkup, qrSize, title, headerBg, headerFg);
                if (!pngBlob) return false;
                var pngUrl = URL.createObjectURL(pngBlob);
                var a = document.createElement('a');
                a.href = pngUrl;
                a.download = filename || 'qrcode.png';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(pngUrl);
                return true;
            } catch (e) {
                console.warn('downloadQrAsPng failed:', e);
                return false;
            }
        };

        // Score entry auto-advance: once an "End" cell holds a complete value — an integer part,
        // a decimal separator, then exactly one digit (e.g. "28,5") — commit it to Blazor and jump
        // to the next still-empty End cell. Lets a phone user fill a whole table without tapping
        // each field. The marked cells are tagged data-end-input by ScoreTable.razor (real players
        // only; Mr. X is derived). Both the narrow and wide layouts render End inputs, but only the
        // visible one has an offsetParent, so the "next empty" search lands in the active layout.
        (function () {
            if (window.__tsumpEndAutoAdvance) return;
            window.__tsumpEndAutoAdvance = true;
            var complete = /^\d+[.,]\d$/;
            document.addEventListener('input', function (e) {
                var el = e.target;
                if (!el || !el.matches || !el.matches('input[data-end-input]')) return;
                if (!complete.test(el.value)) return;
                el.dispatchEvent(new Event('change', { bubbles: true })); // commit via Blazor @onchange
                var all = Array.prototype.slice.call(document.querySelectorAll('input[data-end-input]'));
                for (var j = all.indexOf(el) + 1; j < all.length; j++) {
                    var n = all[j];
                    if (n.offsetParent !== null && !n.readOnly && n.value.trim() === '') {
                        n.focus(); if (n.select) { n.select(); }
                        return;
                    }
                }
                el.blur(); // nothing left to fill
            }, true);
        })();
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Auto-update PWA flow (scoring app only — the organizer keeps the passive
        // restart-to-update banner). This app is used by inexperienced players who won't know how
        // to fully close a PWA on iOS/Android, so a new deploy is applied AGGRESSIVELY: the waiting
        // worker is told to activate at once and the page reloads the moment it takes control. The
        // organizer can't do this because its saves are whole-collection read-modify-writes that a
        // mid-action reload could corrupt; the scoring app only writes one small per-table key, so
        // the risk is acceptable here.
        (function () {
            if (!('serviceWorker' in navigator)) return;

            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (refreshing) return; // guard against reload loops
                refreshing = true;
                window.location.reload();
            });

            function activateWaiting(reg) {
                // The published service worker calls skipWaiting() on this exact string (see
                // service-worker.published.js) and clients.claim()s on activate, which fires the
                // controllerchange handler above.
                if (reg.waiting) reg.waiting.postMessage('SKIP_WAITING');
            }

            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(function (reg) {
                function watch(worker) {
                    if (!worker) return;
                    worker.addEventListener('statechange', function () {
                        // 'installed' while a controller already exists ⇒ an UPDATE, not first install.
                        if (worker.state === 'installed' && navigator.serviceWorker.controller) activateWaiting(reg);
                    });
                }

                if (reg.waiting && navigator.serviceWorker.controller) activateWaiting(reg);
                watch(reg.installing);
                reg.addEventListener('updatefound', function () { watch(reg.installing); });

                // Check for a new deploy whenever the user returns to the app.
                window.addEventListener('focus', function () { reg.update().catch(function () { }); });
            }).catch(function (e) { console.warn('Service worker registration failed:', e); });
        })();
    </script>
</body>

</html>
